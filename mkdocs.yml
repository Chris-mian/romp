site_name: romp
site_description: Mission control for a fleet of AI coding agents.

site_url: https://romp-on.github.io/romp/
repo_url: https://github.com/romp-on/romp
repo_name: romp-on/romp

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    # Brand colour is a placeholder — swap to match the romp wordmark.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - A worked example (MNIST): guide/example-workflow.md
      - The fleet at a glance: guide/the-fleet.md
      - Tasks, not transcripts: guide/tasks.md
      - Keeping the fleet moving: guide/nudges.md
      - The postal service: guide/postal-service.md
      - Sessions and revival: guide/sessions.md
      - Self-hosted and remote access: guide/remote-access.md
  - Architecture: architecture.md
  - Internals:
      - Judges: judges.md
      - The judge pipeline: judge-pipeline.md
      - How a card gets its state: goal-state.md
