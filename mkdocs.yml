site_name: Romp
site_description: Mission control for a fleet of AI coding agents.

site_url: https://romp-on.github.io/romp/
repo_url: https://github.com/romp-on/romp
repo_name: romp-on/romp

theme:
  name: material
  logo: assets/brand/romp-icon-swirl-glyph.svg
  favicon: assets/brand/romp-icon-swirl-glyph.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - navigation.instant
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    # Dark only — romp is a dark UI and every capture is dark. The header blue
    # is the session blue #1EA1EB (see docs/stylesheets/extra.css).
    scheme: slate
    primary: custom
    accent: custom

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - The fleet at a glance: guide/the-fleet.md
      - Tasks, not transcripts: guide/tasks.md
      - Keeping the fleet moving: guide/nudges.md
      - The postal service: guide/postal-service.md
      - Sessions and revival: guide/sessions.md
      - Self-hosted and remote access: guide/remote-access.md
  - How Romp works: architecture.md
  - Reference: reference.md
  - Internals:
      - Judges: judges.md
      - The judge pipeline: judge-pipeline.md
      - How a card gets its state: goal-state.md
      - The event model: event-model.md
      - The read side: read-side.md
      - The SDK session backend: sdk-backend.md
