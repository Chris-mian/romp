name: Docs

# Build the MkDocs site and publish it to GitHub Pages.
#
# The build job runs on every docs push (validates `mkdocs build --strict`).
# The deploy job is GATED so it cleanly skips — rather than fails — until Pages
# is set up. To publish (free Pages requires a PUBLIC repo):
#   1. Settings -> Pages -> Source -> "GitHub Actions"
#   2. Settings -> Secrets and variables -> Actions -> Variables:
#        add repository variable  PAGES_ENABLED = true

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install MkDocs Material
        run: pip install mkdocs-material
      - name: Build (strict — fails on broken links / orphan pages)
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # Skip (not fail) until Pages is enabled and PAGES_ENABLED=true is set.
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
