name: Docs

# Build the MkDocs site and publish it to GitHub Pages.
#
# The build job runs on every docs push (validates `mkdocs build --strict`) AND on every pull request that touches the
# site's inputs (2026-09-21): the strict build used to run only after the merge, so a docs pull request could land a broken
# link or an orphan page and the site broke on main (the restoration of 2026-09-20 resolved its links by hand). On a pull
# request the job builds and stops: no artifact, no publish.
# The deploy job is GATED so it cleanly skips — rather than fails — until Pages
# is set up. To publish (free Pages requires a PUBLIC repo):
#   1. Settings -> Pages -> Source -> "GitHub Actions"
#   2. Settings -> Secrets and variables -> Actions -> Variables:
#        add repository variable  PAGES_ENABLED = true

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - overrides/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - overrides/**
      - README.md
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish. A pull request's build-only run keys on its own
# ref and a newer push cancels the older one (the new head supersedes it), so PR builds never queue behind a publish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install MkDocs Material
        run: pip install "mkdocs-material~=9.0"
      - name: Build (strict — fails on broken links / orphan pages)
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'   # a pull request only proves the site builds; the artifact and the publish are main's
        with:
          path: site

  deploy:
    needs: build
    # Skip (not fail) until Pages is enabled and PAGES_ENABLED=true is set; never from a pull request.
    if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
