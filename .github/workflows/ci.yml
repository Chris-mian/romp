name: CI

# Run the test suites that gate romp: the Python pipeline (bin/), the shell
# surfaces (tmux hooks / postal / manager), and the chat-view extension build.
# Minimal on purpose — one Linux runner per suite, the dev Python/Node versions.
# Broaden to a {macOS, Linux} x {Python 3.11..3.13} matrix later if needed.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run pytest
        run: python -m pytest -q

  shell:
    name: Shell (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats + tmux
        run: sudo apt-get update && sudo apt-get install -y bats tmux
      - name: Run bats
        run: bats tests/*.bats

  chat-view:
    name: chat-view (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-view
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: chat-view/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
