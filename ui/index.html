<!DOCTYPE html>
<!-- romp read side (design/read-side.md), MINIMAL browser version. Three panes (feed / chat /
     timeline) over the new records, served by bin/romp-kernel. Vanilla JS, polls the kernel.
     The single TS view-builder + WS push + tags/views are tracked deferrals (design/backlog.md). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>romp</title>
<style>
  :root { --bg:#14161a; --panel:#1c1f26; --line:#2b2f38; --fg:#dfe3ea; --dim:#8b92a0;
          --work:#5b8def; --block:#e0883b; --done:#54b07a; --accent:#7aa2f7; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.5 -apple-system,system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:14px; padding:8px 14px; border-bottom:1px solid var(--line); }
  header .logo { font-weight:700; color:var(--accent); letter-spacing:.5px; }
  header button { background:none; border:1px solid var(--line); color:var(--dim); padding:5px 12px;
                  border-radius:6px; cursor:pointer; font-size:13px; }
  header button.on { color:var(--fg); border-color:var(--accent); background:#222838; }
  header .status { margin-left:auto; color:var(--dim); font-size:12px; }
  main { padding:12px 14px; }
  .hidden { display:none; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--dim); margin:0 0 8px; }

  /* feed */
  .feed { display:grid; grid-template-columns:1fr 1fr 1fr 320px; gap:12px; }
  .col h2 .n { color:var(--fg); }
  .card { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--work);
          border-radius:7px; padding:8px 10px; margin-bottom:8px; cursor:pointer; }
  .card.blocked { border-left-color:var(--block); }
  .card.completed { border-left-color:var(--done); }
  .card .sess { color:var(--dim); font-size:11px; }
  .card .goal { margin-top:2px; }
  .card .trail { margin-top:7px; border-top:1px dashed var(--line); padding-top:6px; display:none; }
  .card.open .trail { display:block; }
  .node { color:var(--dim); padding:1px 0; }
  .node .mark { display:inline-block; width:16px; color:var(--dim); }
  .node.done .mark { color:var(--done); } .node.blk .mark { color:var(--block); }
  .stream .cap { padding:4px 0; border-bottom:1px solid var(--line); }
  .stream .cap .s { color:var(--dim); font-size:11px; }

  /* chat */
  .chatwrap { display:grid; grid-template-columns:300px 1fr; gap:14px; }
  .toc { background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:10px;
         max-height:80vh; overflow:auto; }
  .toc .headline { font-weight:600; margin-bottom:8px; }
  .toc .tline { color:var(--dim); cursor:pointer; padding:2px 0; }
  .toc .tline:hover { color:var(--fg); }
  .toc .sline { margin-left:14px; color:#6b7280; cursor:pointer; font-size:12px; }
  .transcript { max-height:80vh; overflow:auto; }
  .atom { padding:6px 10px; margin-bottom:6px; border-radius:7px; background:var(--panel);
          border:1px solid var(--line); }
  .atom.user { border-left:3px solid var(--accent); }
  .atom.assistant { border-left:3px solid #3a4150; }
  .atom.system, .atom.idle { color:var(--dim); font-style:italic; background:none; border:none; }
  .atom .meta { color:var(--dim); font-size:11px; margin-bottom:2px; }
  .atom .tool { color:var(--block); font-size:12px; }
  .sesspick select { background:var(--panel); color:var(--fg); border:1px solid var(--line);
                     border-radius:6px; padding:5px; }

  /* timeline */
  .lane { display:grid; grid-template-columns:130px 1fr; gap:8px; align-items:center; margin-bottom:6px; }
  .lane .name { color:var(--dim); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track { position:relative; height:20px; background:#171a20; border-radius:4px; }
  .bar { position:absolute; height:14px; top:3px; background:var(--work); border-radius:3px; cursor:pointer;
         min-width:3px; opacity:.85; }
  .bar:hover { opacity:1; outline:1px solid var(--accent); }
  .idle { position:absolute; height:20px; top:0; background:repeating-linear-gradient(45deg,#1b1e25,#1b1e25 4px,#15171c 4px,#15171c 8px); }
  #tip { position:fixed; background:#000; color:#fff; padding:4px 8px; border-radius:5px; font-size:12px;
         pointer-events:none; display:none; max-width:340px; z-index:9; }
</style>
</head>
<body>
<header>
  <span class="logo">romp</span>
  <button data-pane="feed" class="on">Feed</button>
  <button data-pane="chat">Chat</button>
  <button data-pane="timeline">Timeline</button>
  <span class="status" id="status">connecting…</span>
</header>
<main>
  <section id="feed"></section>
  <section id="chat" class="hidden"></section>
  <section id="timeline" class="hidden"></section>
</main>
<div id="tip"></div>
<script>
const $ = (s, r=document) => r.querySelector(s);
const el = (t, c, txt) => { const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e; };
const esc = s => (s||"");
let pane = "feed", curSid = null;

document.querySelectorAll("header button").forEach(b => b.onclick = () => {
  pane = b.dataset.pane;
  document.querySelectorAll("header button").forEach(x => x.classList.toggle("on", x===b));
  ["feed","chat","timeline"].forEach(p => $("#"+p).classList.toggle("hidden", p!==pane));
  refresh();
});

async function get(url){ const r = await fetch(url); return r.json(); }

function renderFeed(d){
  const root = $("#feed"); root.innerHTML = "";
  const wrap = el("div","feed");
  const cols = [["working","Working"],["blocked","Blocked"],["completed","Completed"]];
  for (const [k,label] of cols){
    const c = el("div","col");
    const cards = d.columns[k]||[];
    c.appendChild(el("h2", null, "")).innerHTML = label+' <span class="n">'+cards.length+'</span>';
    for (const card of cards){
      const ce = el("div","card "+card.status);
      ce.appendChild(el("div","sess", card.session));
      ce.appendChild(el("div","goal", card.text));
      const tr = el("div","trail");
      const walk = (n,depth) => { const r=el("div","node"+(n.done?" done":"")+(n.blocked?" blk":""));
        r.style.marginLeft=(depth*14)+"px";
        r.appendChild(el("span","mark", n.done?"✓":(n.blocked?"!":"·")));
        r.appendChild(document.createTextNode(" "+n.text)); tr.appendChild(r);
        (n.kids||[]).forEach(k=>walk(k,depth+1)); };
      (card.trail.kids||[]).forEach(k=>walk(k,0));
      ce.appendChild(tr);
      ce.onclick = () => ce.classList.toggle("open");
      c.appendChild(ce);
    }
    wrap.appendChild(c);
  }
  const sc = el("div","col stream");
  sc.appendChild(el("h2",null,"Caption stream"));
  const now = Date.now()/1000;
  for (const cap of d.stream){
    const ce = el("div","cap"); ce.style.opacity = Math.max(0.35, 1 - (now-cap.t)/172800);
    ce.appendChild(el("div",null,cap.caption));
    ce.appendChild(el("div","s", cap.session));
    sc.appendChild(ce);
  }
  wrap.appendChild(sc); root.appendChild(wrap);
}

async function renderChat(){
  const root = $("#chat");
  const sess = (await get("/api/sessions")).sessions;
  if (!curSid && sess.length) curSid = sess[0].sid;
  root.innerHTML = "";
  const pick = el("div","sesspick"); const sel = el("select");
  for (const s of sess){ const o=el("option",null,(s.name||s.sid.slice(0,8))+" — "+(s.headline||"")); o.value=s.sid; if(s.sid===curSid)o.selected=true; sel.appendChild(o); }
  sel.onchange = () => { curSid = sel.value; renderChat(); };
  pick.appendChild(sel); root.appendChild(pick);
  if (!curSid) return;
  const d = await get("/api/chat?sid="+encodeURIComponent(curSid));
  const wrap = el("div","chatwrap");
  const toc = el("div","toc");
  toc.appendChild(el("div","headline", d.headline||d.name||""));
  for (const t of d.toc){
    const tl = el("div","tline", "• "+t.caption);
    if (t.anchor) tl.onclick = () => { const a=$("#atom-"+CSS.escape(t.anchor)); if(a) a.scrollIntoView({behavior:"smooth",block:"center"}); };
    toc.appendChild(tl);
    for (const s of (t.segs||[])){
      const sl = el("div","sline", "– "+s.caption);
      if (s.anchor) sl.onclick = () => { const a=$("#atom-"+CSS.escape(s.anchor)); if(a) a.scrollIntoView({behavior:"smooth",block:"center"}); };
      toc.appendChild(sl);
    }
  }
  const tr = el("div","transcript");
  for (const a of d.atoms){
    const base = a.type.startsWith("system")?"system":(a.type==="idle"?"idle":a.type);
    const ae = el("div","atom "+base); if (a.uuid) ae.id = "atom-"+a.uuid;
    const meta = a.type==="user" ? ("user · "+(a.author||"")) : a.type;
    ae.appendChild(el("div","meta", meta));
    if (a.thinking) ae.appendChild(el("div","tool","✦ thinking"));
    if (a.text) ae.appendChild(el("div",null,a.text));
    if (a.toolResult && !a.text) ae.appendChild(el("div","tool","↳ tool result"));
    for (const t of (a.tools||[])) ae.appendChild(el("div","tool","⚙ "+t));
    if (a.type==="idle") ae.textContent = "— idle —";
    tr.appendChild(ae);
  }
  wrap.appendChild(toc); wrap.appendChild(tr); root.appendChild(wrap);
}

function renderTimeline(d){
  const root = $("#timeline"); root.innerHTML = "";
  root.appendChild(el("h2",null,"Sessions × segments"));
  const span = Math.max(1, d.hi - d.lo);
  const pct = t => ((t - d.lo)/span*100);
  for (const lane of d.lanes){
    const l = el("div","lane");
    l.appendChild(el("div","name", lane.name));
    const track = el("div","track");
    for (const g of lane.idles){ const ie=el("div","idle"); ie.style.left=pct(g.t)+"%"; ie.style.width=Math.max(0.3,pct(g.end)-pct(g.t))+"%"; track.appendChild(ie); }
    for (const b of lane.bars){
      const be = el("div","bar"); be.style.left=pct(b.t)+"%"; be.style.width=Math.max(0.4,pct(b.end)-pct(b.t))+"%";
      be.onmousemove = (e) => { const tip=$("#tip"); tip.style.display="block"; tip.textContent=b.caption||"(no caption)"; tip.style.left=(e.clientX+12)+"px"; tip.style.top=(e.clientY+12)+"px"; };
      be.onmouseleave = () => $("#tip").style.display="none";
      track.appendChild(be);
    }
    l.appendChild(track); root.appendChild(l);
  }
  if (!d.lanes.length) root.appendChild(el("div","node","No segments yet."));
}

async function refresh(){
  try {
    if (pane==="feed") renderFeed(await get("/api/feed"));
    else if (pane==="chat") await renderChat();
    else if (pane==="timeline") renderTimeline(await get("/api/timeline"));
    $("#status").textContent = "live · " + new Date().toLocaleTimeString();
  } catch(e){ $("#status").textContent = "kernel offline"; }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
