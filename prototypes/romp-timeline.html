<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>romp — activity & messages</title>
<style>
  :root { --bg:#0e1116; --grid:#ffffff12; --gridStrong:#ffffff22;
    --ink:#e6edf3; --muted:#8b949e; --faint:#6e7681; --lane:#ffffff14; --dotBorder:#e8eef5; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  #top { display:flex; align-items:center; gap:14px; padding:12px 18px 8px; }
  #top .win { color:var(--muted); font-size:12.5px; min-width:64px; }
  #top .win b { color:var(--ink); font-variant-numeric:tabular-nums; }
  #win { flex:1; max-width:520px; -webkit-appearance:none; appearance:none;
    height:6px; border-radius:3px; background:#2a2f37; outline:none; }
  #win::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:15px; height:15px;
    border-radius:50%; background:#e6edf3; cursor:pointer; }
  #win::-moz-range-thumb { width:15px; height:15px; border:none; border-radius:50%; background:#e6edf3; cursor:pointer; }
  #win::-moz-range-track { background:transparent; }
  #src { color:var(--faint); font-size:11.5px; margin-left:auto; }
  #wrap { padding:0 12px 24px; }
  svg { display:block; width:100%; height:auto; }
  .lane-label { font-weight:650; font-size:12px; }
  .axis-label { fill:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
  .msg-line { fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .hit { cursor:pointer; }
  .dot { cursor:pointer; transition:r .08s ease; }
  #tip { position:fixed; pointer-events:none; z-index:10; max-width:340px;
    background:#1c2430; border:1px solid #ffffff1f; border-radius:8px; padding:8px 10px;
    font-size:12.5px; color:var(--ink); box-shadow:0 8px 24px #00000066;
    opacity:0; transform:translateY(4px); transition:opacity .1s, transform .1s; }
  #tip.show { opacity:1; transform:translateY(0); }
  #tip .row { display:flex; align-items:center; gap:7px; margin-bottom:3px; }
  #tip .who { font-weight:650; } #tip .arrow { color:var(--faint); }
  #tip .kind { color:var(--faint); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  #tip .time { color:var(--muted); font-variant-numeric:tabular-nums; }
  #tip .body { margin-top:5px; color:#cdd9e5; } #tip .lat { color:var(--faint); font-size:11px; margin-top:4px; }
  #tip .chip { width:9px; height:9px; border-radius:50%; display:inline-block; }
</style>
</head>
<body>
<div id="top">
  <span class="win">window <b id="winval">1h</b></span>
  <input id="win" type="range" min="0" max="1000" value="316">
  <span id="src"></span>
</div>
<div id="wrap"><svg id="chart" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="tip"></div>

<!-- Real data, when present, is written here by `prototypes/romp-timeline-data`. -->
<script src="romp-timeline-data.js" onerror="void 0"></script>
<script>
// ── mock fallback (absolute epochs, last 30 min) ───────────────────────────
const nowS = Math.floor(Date.now()/1000);
const MOCK = (() => { const m = (min) => nowS - (30-min)*60; return {
  now: nowS,
  sessions: [
    { name:'postal',        color:'#179EE8', state:'working' },
    { name:'new_notebook',  color:'#F37C2F', state:'idle' },
    { name:'vscode_plugin', color:'#57B50F', state:'idle' },
    { name:'karibener',     color:'#9C95FE', state:'permission' },
  ],
  turns: {
    postal:        [ {start:m(2),end:m(9),prompt:'wire up postal push-on-deliver'},
                     {start:m(14),end:m(20),prompt:'review the lockfile fix'},
                     {start:m(26),end:m(30),prompt:'ship it'} ],
    new_notebook:  [ {start:m(0),end:m(5),prompt:'refactor the parser'},
                     {start:m(11),end:m(23),prompt:'check the build is green'} ],
    vscode_plugin: [ {start:m(6),end:m(12),prompt:'look at the CI failure'},
                     {start:m(18),end:m(28),prompt:'add inline diff decorations'} ],
    karibener:     [ {start:m(3),end:m(7),prompt:'draft the editor-team plan'},
                     {start:m(15),end:m(19),prompt:'merge the editor-team branch'},
                     {start:m(24),end:m(30),prompt:'rebase on main'} ],
  },
  messages: [
    { from:'postal',        to:'new_notebook',  sent:m(4),  exec:m(11), text:'can you check the build is green?' },
    { from:'new_notebook',  to:'vscode_plugin', sent:m(5),  exec:m(6),  text:'extension tests failing on CI — take a look?' },
    { from:'vscode_plugin', to:'postal',        sent:m(10), exec:m(14), text:'fixed it — stale lockfile, pushed' },
    { from:'postal',        to:'karibener',     sent:m(18), exec:m(24), text:'hold on — rebase on main first, 3 new commits' },
    { from:'new_notebook',  to:'postal',        sent:m(21), exec:m(26), text:'done, all green ✅' },
  ],
}; })();
// DATA is mutable: refreshed from the live server (/data) when served, else the
// generated snapshot (window.ROMP_DATA), else MOCK. dataNow + loadedAt let the
// "now" edge advance smoothly between refreshes so the timeline scrolls forward.
let DATA = MOCK, dataNow = nowS, loadedAt = performance.now(), loaded = false, fitted = false;
function liveNow(){ return dataNow + (performance.now()-loadedAt)/1000; }

// ── config ─────────────────────────────────────────────────────────────────
const SVGNS='http://www.w3.org/2000/svg';
const svg=document.getElementById('chart'), tip=document.getElementById('tip');
const M={ left:130, right:18, top:8, bottom:22 };   // axis labels live in the bottom margin
const LANE_GAP=26, BAR_H=8, CORNER=6, MSG_DROP=10, DOT_R=6, CLEAR=DOT_R+4, COINCIDE=45;
// each directed flow (A→B) is ONE line; thickness = MSG_W0 + (count-1)*MSG_GROW,
// linear in message count with no cap (BAR_H=8 work-bar is the reference; a flow
// passes it ~5-6 messages in). Alpha .5 keeps overlapping flows legible.
const MSG_W0=2, MSG_GROW=1.3;
const STALE_FADE=0.4;   // idle >1h: dim name/chip/ctx (color kept), like the dashboard's .is-stale
const PADL=8, COLGAP=10;                              // gutter: name col | chip col
// Obsidian-style status chip (mirrors vault-code mapState + .romp-badge
// colors): working=yellow, ready=blue, awaiting=red. Shown below each LIVE
// session's name; historical sessions (no current state) get none.
const BADGE={ working:{bg:'#E0B020',fg:'#332600'}, ready:{bg:'#2B7FB8',fg:'#ffffff'},
              attention:{bg:'#C0392B',fg:'#ffffff'}, compacting:{bg:'#11808f',fg:'#ffffff'} };
const RAINBOW_STOPS=['#a61e1e','#b35309','#6d5900','#1f7a33','#14538f','#6b21a8','#a61e1e'];
function badgeFor(s){
  if(!s||!s.live) return null;
  let m=null;
  if(s.state==='compacting') m={label:'COMPACTING',kind:'compacting'};
  else if(s.state==='working') m={label:'WORKING',kind:'working'};
  else if(s.state==='waiting'||s.state==='idle') m={label:'READY',kind:'ready'};
  else if(s.state==='permission'||s.state==='awaiting') m={label:'AWAITING',kind:'attention'};
  if(!m) return null;
  return {label:m.label, bg:BADGE[m.kind].bg, fg:BADGE[m.kind].fg};
}
// context-window fill % → battery bar (matches romp-chat-view): fill width = pct, recolored by level
// (green <60, amber 60–84, red ≥85). null for historical sessions / before first report.
const BAT_W=48, BAT_H=14;
function ctxInfo(s){ if(!s||s.context==null) return null;
  const p=s.context; return {label:p+'%', pct:p, color:p>=85?'#c0392b':(p>=60?'#e0b020':'#54B204')}; }
// model + effort, e.g. "Opus 4.8 xhigh" — the same string the Claude status bar shows
// (statusline.sh publishes @claude-model/@claude-effort to tmux). Muted text between name and chip.
const MODEL_FG='#9aa0a6';
function modelLabel(s){ if(!s||!s.model) return ''; return s.effort? s.model+' '+s.effort : s.model; }
const MIN_W=600, MAX_W=172800;                                  // 10 min … 48 h

const winEl=document.getElementById('win'), winVal=document.getElementById('winval');
const colorOf=(n)=>{ const s=DATA.sessions.find(x=>x.name===n); return s? s.color : '#888'; };

function el(t,a){ const n=document.createElementNS(SVGNS,t); for(const k in a) n.setAttribute(k,a[k]); return n; }
// Slider reversed: handle LEFT = more time (up to 48h), RIGHT = zoomed in to now.
function winSec(){ return Math.round(MIN_W*Math.pow(MAX_W/MIN_W, 1-(+winEl.value)/1000)); }
function valueForWindow(w){ return Math.round(1000*(1 - Math.log(w/MIN_W)/Math.log(MAX_W/MIN_W))); }
function paintSlider(){ const p=(+winEl.value)/1000*100;   // blue fills to the RIGHT of the thumb (toward now)
  winEl.style.background=`linear-gradient(to right, #2a2f37 0 ${p}%, #3b82f6 ${p}% 100%)`; }
function fmtWin(s){ return s<3600 ? Math.round(s/60)+'m' : (s/3600<10 ? (s/3600).toFixed(1) : Math.round(s/3600))+'h'; }
function clock(t){ const d=new Date(t*1000); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
const NICE=[60,300,600,900,1800,3600,7200,10800,21600,43200,86400,172800];
function niceStep(W){ for(const s of NICE) if(W/s<=8) return s; return 172800; }

// rounded orthogonal path through waypoints
function roundedPath(pts,r){
  const p=pts.filter((q,i)=> i===0 || q.x!==pts[i-1].x || q.y!==pts[i-1].y);
  if(p.length<2) return '';
  let d=`M ${p[0].x} ${p[0].y}`;
  for(let i=1;i<p.length-1;i++){
    const a=p[i-1], c=p[i], b=p[i+1];
    const inL=Math.hypot(c.x-a.x,c.y-a.y), outL=Math.hypot(b.x-c.x,b.y-c.y);
    const rr=Math.max(0,Math.min(r,inL/2,outL/2));
    const i1={x:c.x-Math.sign(c.x-a.x)*rr, y:c.y-Math.sign(c.y-a.y)*rr};
    const o1={x:c.x+Math.sign(b.x-c.x)*rr, y:c.y+Math.sign(b.y-c.y)*rr};
    d+=` L ${i1.x} ${i1.y} Q ${c.x} ${c.y} ${o1.x} ${o1.y}`;
  }
  const L=p[p.length-1]; d+=` L ${L.x} ${L.y}`; return d;
}
// pick a crossing x that the vertical won't drag through an unrelated dot
function crossX(sLane,rLane,xs,xe,obstacles){
  const lo=Math.min(sLane,rLane), hi=Math.max(sLane,rLane);
  const between=obstacles.filter(o=>o.lane>lo&&o.lane<hi&&o.x>=xs-CLEAR&&o.x<=xe+CLEAR);
  let xc=xs, changed=true, g=0;
  while(changed&&g++<60){ changed=false; for(const o of between) if(Math.abs(o.x-xc)<CLEAR){ xc=o.x+CLEAR; changed=true; } }
  return xc>xe ? xs : xc;
}

// measure label widths so the left gutter auto-fits the longest session name
const _mc=document.createElement('canvas').getContext('2d');
const LABEL_FONT='650 12px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif';
function labelWidth(s){ _mc.font=LABEL_FONT; return _mc.measureText(s||'').width; }
const BADGE_FS=9;
function badgeWidth(s){ _mc.font='700 '+BADGE_FS+'px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif'; return _mc.measureText(s||'').width; }
function ctxWidth(s){ _mc.font='600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif'; return _mc.measureText(s||'').width; }
function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
// hover text: prompt dot = the request phrase (condensed ask); activity bar = the
// reply phrase (what the turn did). Fall back gracefully until logging fills in.
function turnReq(t){ return t.summary ? esc(t.summary) : (t.prompt ? esc(t.prompt.slice(0,120)) : ''); }
function turnReply(t){ return t.reply ? esc(t.reply) : (t.summary ? esc(t.summary) : ''); }
function bodyDiv(s){ return s ? `<div class="body">${s}</div>` : ''; }
// activity-bar hover = what the agent DID, once the turn is done. While still in
// progress, show "working on… <the prompt>" (clearly not-yet-a-result); it auto-
// swaps to the real reply summary when the turn finishes.
function barBody(t,ongoing){
  if(t.reply) return `<div class="body">${esc(t.reply)}</div>`;
  const req = t.summary ? esc(t.summary) : (t.prompt ? esc(t.prompt.slice(0,120)) : '');
  if(ongoing) return `<div class="body"><span style="opacity:.55;font-style:italic">working on: </span>${req||'awaiting summary'}</div>`;
  // finished turn, no reply summary: show the request itself, muted — never a false "working on…".
  return `<div class="body"><span style="opacity:.55;font-style:italic">request: </span>${req||'(no summary)'}</div>`;
}

function showTip(html,ev){ tip.innerHTML=html; tip.classList.add('show'); moveTip(ev); }
function moveTip(ev){ const pad=14; let lx=ev.clientX+pad, ly=ev.clientY+pad; const r=tip.getBoundingClientRect();
  if(lx+r.width>innerWidth) lx=ev.clientX-r.width-pad; if(ly+r.height>innerHeight) ly=ev.clientY-r.height-pad;
  tip.style.left=lx+'px'; tip.style.top=ly+'px'; }
function hideTip(){ tip.classList.remove('show'); }

function render(){
  winVal.textContent=fmtWin(winSec()); paintSlider();
  svg.innerHTML='';
  // candy-cane hatch for AWAITING spans: diagonal white stripes overlaid on the bar
  const defs=el('defs',{});
  const pat=el('pattern',{id:'await-hatch',patternUnits:'userSpaceOnUse',width:7,height:7,patternTransform:'rotate(45)'});
  pat.appendChild(el('line',{x1:0,y1:0,x2:0,y2:7,stroke:'#ffffff','stroke-width':4,opacity:0.78}));
  defs.appendChild(pat);
  // WORKING-chip rainbow shimmer — mirrors romp-chat-view's .chip-rainbow: deep darker stops (readable
  // on the #E0B020 yellow pill) sweeping the letters; SVG text can't background-clip:text so it's a
  // gradient text-fill animated by SMIL, with begin synced to wall-clock phase so the per-render SVG
  // rebuild resumes mid-cycle (no stutter).
  const rg=el('linearGradient',{id:'rainbow-working',x1:'0',y1:'0',x2:'3',y2:'0',gradientUnits:'objectBoundingBox',spreadMethod:'repeat'});
  ['#a61e1e','#b35309','#6d5900','#1f7a33','#14538f','#6b21a8','#a61e1e'].forEach((c,i,a)=>rg.appendChild(el('stop',{offset:(i/(a.length-1)).toFixed(4),'stop-color':c})));
  const RB_DUR=2.4, rbPhase=(Date.now()/1000)%RB_DUR;
  rg.appendChild(el('animateTransform',{attributeName:'gradientTransform',type:'translate',from:'0 0',to:'-3 0',dur:RB_DUR+'s',begin:(-rbPhase).toFixed(3)+'s',repeatCount:'indefinite'}));
  defs.appendChild(rg);
  svg.appendChild(defs);
  const t1=liveNow(), t0=t1-winSec();
  const inWin=(t)=> t>=t0 && t<=t1;
  const overlaps=(a,b)=> b>=t0 && a<=t1;
  // An event is positioned at its PROCESS-START — when it began affecting the workflow.
  // While still pending (queued / in-flight, not yet worked) it rides the live `now`
  // edge (t1) and slides forward each frame; once processed the data carries a FIXED
  // past time so it can never equal t1 again (this is the anti-"perpetual-just-landing"
  // guarantee). A resolved enqueue snaps to its resolution time (t.proc), not its
  // submission time. Tooltip TEXT still shows the true sent/exec times (unchanged).
  const execAt=(mm)=> mm.pending ? t1 : mm.exec;
  const startAt=(t)=> t.pending ? t1 : (t.proc!=null ? t.proc : t.start);

  // Only sessions ACTIVE in the visible window get a lane — a turn overlapping it,
  // or a message they sent/received in it. Scrolling the window changes this set,
  // so lanes appear/disappear as you move through time (live or historical alike).
  // live sessions ALWAYS get a lane (even with no activity in this window);
  // closed sessions appear only when the window covers their past activity
  const active=(s)=> s.live ||
    (DATA.turns[s.name]||[]).some(t=> overlaps(t.start,t.end)) ||
    DATA.messages.some(m=> (m.from===s.name||m.to===s.name)
                           && overlaps(Math.min(m.sent,m.exec), Math.max(m.sent,m.exec)));
  const vis=DATA.sessions.filter(active);
  const vidx={}; vis.forEach((s,i)=>vidx[s.name]=i);

  // gutter = name column (left-aligned) + chip column (all chips share an x,
  // like the dashboard's badge column)
  const visB=vis.map(s=>badgeFor(s));
  const visC=vis.map(s=>ctxInfo(s));
  const visM=vis.map(s=>modelLabel(s));
  const maxName=Math.max(40,...(vis.length?vis:DATA.sessions).map(s=>labelWidth(s.name)));
  const maxModel=Math.max(0,...visM.map(m=> m?ctxWidth(m):0));   // model+effort (same 11px font as ctx)
  const maxChip=Math.max(0,...visB.map(b=> b?badgeWidth(b.label)+12:0));
  const maxCtx=(visC.some(c=>c)||vis.some(s=>s.state==='compacting'))?BAT_W:0;   // ctx column = battery bar
  const modelColX=PADL+Math.ceil(maxName)+COLGAP;               // [name] [model+effort] [chip] [ctx]
  const chipColX=modelColX+(maxModel>0?Math.ceil(maxModel)+COLGAP:0);
  const ctxColX=chipColX+(maxChip>0?Math.ceil(maxChip)+COLGAP:0);
  M.left=ctxColX+(maxCtx>0?Math.ceil(maxCtx)+COLGAP:4);

  const W=Math.max(900, svg.clientWidth||svg.parentNode.clientWidth);
  const plotW=W-M.left-M.right, H=M.top+Math.max(1,vis.length)*LANE_GAP+M.bottom;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('height',H);
  const x=(t)=> M.left + ((t-t0)/(t1-t0))*plotW;
  const laneY=(i)=> M.top + i*LANE_GAP + LANE_GAP*0.5;

  // axis — gridlines over the lane area, time labels along the BOTTOM
  const step=niceStep(t1-t0); const axisY=H-M.bottom;
  for(let tk=Math.ceil(t0/step)*step; tk<=t1; tk+=step){
    svg.appendChild(el('line',{x1:x(tk),y1:M.top,x2:x(tk),y2:axisY,stroke:'var(--grid)','stroke-width':1}));
    const tx=el('text',{x:x(tk),y:axisY+14,'text-anchor':'middle',class:'axis-label'}); tx.textContent=clock(tk); svg.appendChild(tx);
  }
  svg.appendChild(el('line',{x1:x(t1),y1:M.top,x2:x(t1),y2:axisY,stroke:'var(--gridStrong)','stroke-width':1}));
  if(!vis.length){
    const tx=el('text',{x:M.left,y:M.top+16,class:'axis-label'}); tx.textContent='no romp activity in this window'; svg.appendChild(tx);
  }

  // lanes + activity bars + status dot + label
  vis.forEach((s,i)=>{
    const y=laneY(i);
    svg.appendChild(el('line',{x1:M.left,y1:y,x2:x(t1),y2:y,stroke:'var(--lane)','stroke-width':2,'stroke-linecap':'round'}));
    (DATA.turns[s.name]||[]).forEach(t=>{
      const a=Math.max(t.start,t0), b=Math.min(t.end,t1); if(b<=a) return;
      // base bar (whole turn, solid) — also the colored backing under the AWAITING candy-stripe
      svg.appendChild(el('rect',{x:x(a),y:y-BAR_H/2,width:Math.max(2,x(b)-x(a)),height:BAR_H,rx:BAR_H/2,fill:s.color,opacity:0.9}));
      const act=s.state==='working'||s.state==='permission'||s.state==='awaiting';
      const ongoing=s.live&&act&&t.end>t.start&&(DATA.now-t.end)<=5;
      // Split the turn at its AWAITING intervals → independent WORK segments (pre/post the pause),
      // each hovers+grows on its own; the awaiting span between them is the candy-stripe (below).
      // Pre-pause work shows the REQUEST ("working on…"); the final segment shows the REPLY.
      const awIn=(s.awaiting||[]).filter(sp=>sp[1]>t.start&&sp[0]<t.end)
        .map(sp=>[Math.max(sp[0],t.start),Math.min(sp[1],t.end)]).sort((p,q)=>p[0]-q[0]);
      const segs=[]; let cur=t.start;
      for(const sp of awIn){ if(sp[0]>cur) segs.push([cur,sp[0]]); cur=Math.max(cur,sp[1]); }
      if(cur<t.end) segs.push([cur,t.end]);
      if(!segs.length) segs.push([t.start,t.end]);
      const eh=BAR_H+5;
      segs.forEach((sg,si)=>{
        const sa=Math.max(sg[0],t0), sb=Math.min(sg[1],t1); if(sb<=sa) return;
        const sx=x(sa), sw=Math.max(2,x(sb)-x(sa)), isLast=si===segs.length-1;
        const hl=el('rect',{x:sx,y:y-eh/2,width:sw,height:eh,rx:eh/2,fill:s.color,opacity:0});
        svg.appendChild(hl);
        const hit=el('rect',{x:sx,y:y-7,width:sw,height:14,fill:'transparent',class:'hit'});
        const body=isLast?barBody(t,ongoing)
          :`<div class="body"><span style="opacity:.55;font-style:italic">working on: </span>${turnReq(t)||'awaiting summary'}</div>`;
        const barHtml=()=>`<div class="row"><span class="chip" style="background:${s.color}"></span>`+
          `<span class="who" style="color:${s.color}">${s.name}</span>`+
          `<span class="time">${clock(sg[0])}–${clock(sg[1])}</span></div>`+body;
        hit.addEventListener('mouseenter',e=>{hl.setAttribute('opacity','1');showTip(barHtml(),e);});
        hit.addEventListener('mousemove',moveTip);
        hit.addEventListener('mouseleave',()=>{hl.setAttribute('opacity','0');hideTip();});
        svg.appendChild(hit);
      });
    });
    // AWAITING (permission) → candy-stripe every span the session sat blocked on your input
    // (historical, from the state-transition log) plus the current open one.
    const aw=(s.awaiting&&s.awaiting.length)?s.awaiting
             :((s.live&&(s.state==='permission'||s.state==='awaiting')&&s.since!=null)?[[s.since,t1]]:[]);
    for(const span of aw){
      const a=Math.max(span[0],t0), b=Math.min(span[1],t1);
      if(b<=a) continue;
      const sw=Math.max(2,x(b)-x(a)), eh=BAR_H+5;
      const stripe=el('rect',{x:x(a),y:y-BAR_H/2,width:sw,height:BAR_H,fill:'url(#await-hatch)'});
      svg.appendChild(stripe);
      const sh=el('rect',{x:x(a),y:y-7,width:sw,height:14,fill:'transparent',class:'hit'});
      const end=span[1]>=DATA.now-2?'now':clock(span[1]);
      const shtml=()=>`<div class="row"><span class="chip" style="background:#C0392B"></span><span class="who" style="color:${s.color}">${s.name}</span><span class="kind">awaiting</span></div><div class="body">awaiting your input · ${clock(span[0])}–${end}</div>`;
      sh.addEventListener('mouseenter',e=>{stripe.setAttribute('y',y-eh/2);stripe.setAttribute('height',eh);showTip(shtml(),e);});
      sh.addEventListener('mousemove',moveTip);
      sh.addEventListener('mouseleave',()=>{stripe.setAttribute('y',y-BAR_H/2);stripe.setAttribute('height',BAR_H);hideTip();});
      svg.appendChild(sh);
    }
    // name left-aligned; status chip in the shared chip column to its right. Idle >1h
    // (s.faded) ENDED or idle >1h dims name/chip/ctx via opacity — the identity color is preserved.
    const fade=s.faded?STALE_FADE:1;
    const lbl=el('text',{x:PADL,y:y+3.5,'text-anchor':'start',class:'lane-label','font-size':12,fill:s.color,opacity:fade}); lbl.textContent=s.name; svg.appendChild(lbl);
    // model + effort, muted, between the name and the state chip
    const ml=visM[i];
    if(ml){ const mt=el('text',{x:modelColX,y:y+3.5,'text-anchor':'start','font-size':11,'font-weight':600,fill:MODEL_FG,opacity:fade}); mt.textContent=ml; svg.appendChild(mt); }
    const bdg=visB[i];
    if(bdg){
      const h=14, padX=6, w=Math.ceil(badgeWidth(bdg.label))+padX*2, by=y-h/2;
      svg.appendChild(el('rect',{x:chipColX,y:by,width:w,height:h,rx:h/2,fill:bdg.bg,opacity:fade}));
      const chipFill = s.state==='working' ? 'url(#rainbow-working)' : bdg.fg;   // WORKING letters shimmer (mirrors chat-view)
      const bt=el('text',{x:chipColX+w/2,y:y+3,'text-anchor':'middle',fill:chipFill,'font-size':BADGE_FS,'font-weight':700,opacity:fade});
      bt.setAttribute('letter-spacing','0.03em'); bt.textContent=bdg.label; svg.appendChild(bt);
    }
    // context-window battery bar; while COMPACTING → a rainbow scan-bar (no %) instead
    const cinfo=visC[i], isComp=s.state==='compacting';
    if(cinfo||isComp){
      const byTop=y-BAT_H/2;
      svg.appendChild(el('rect',{x:ctxColX,y:byTop,width:BAT_W,height:BAT_H,rx:3,fill:'rgba(255,255,255,0.07)',stroke:'rgba(255,255,255,0.35)','stroke-width':1,opacity:fade}));
      if(isComp){
        // thin vertical bar SCANS right→left, filled with a fixed userSpaceOnUse rainbow over the
        // battery (→ color cycles with position); begin synced to the SVG timeline so it doesn't jump.
        const gid='rainbow-scan-'+i, ix0=ctxColX+1, ix1=ctxColX+BAT_W-1, barW=4, DUR=1.6;
        const grad=el('linearGradient',{id:gid,gradientUnits:'userSpaceOnUse',x1:ix0,y1:0,x2:ix1,y2:0});
        RAINBOW_STOPS.forEach((c,k,a)=>grad.appendChild(el('stop',{offset:(k/(a.length-1)).toFixed(3),'stop-color':c})));
        svg.appendChild(grad);
        const tline=(svg.getCurrentTime?svg.getCurrentTime():0), ph=((tline%DUR)+DUR)%DUR;
        const bar=el('rect',{x:ix1-barW,y:byTop+1,width:barW,height:BAT_H-2,rx:1,fill:'url(#'+gid+')',opacity:fade});
        bar.appendChild(el('animate',{attributeName:'x',from:ix1-barW,to:ix0,dur:DUR+'s',begin:(-ph).toFixed(3)+'s',repeatCount:'indefinite'}));
        svg.appendChild(bar);
      } else {
        const fillW=Math.max(0,Math.min(1,cinfo.pct/100))*(BAT_W-2);
        if(fillW>0.5) svg.appendChild(el('rect',{x:ctxColX+1,y:byTop+1,width:fillW,height:BAT_H-2,rx:2,fill:cinfo.color,opacity:fade}));
        const ct=el('text',{x:ctxColX+BAT_W/2,y:y+3,'text-anchor':'middle',fill:'#ffffff','font-size':9,'font-weight':700,'font-family':'ui-monospace, SFMono-Regular, Menlo, monospace',opacity:fade});
        ct.setAttribute('style','text-shadow: 0 0 2px rgba(0,0,0,.75)');
        ct.textContent=cinfo.label; svg.appendChild(ct);
      }
    }
  });

  // obstacle dots (routing): message process-starts + turn process-starts on VISIBLE
  // lanes (a pending event's obstacle rides `now` via execAt/startAt, same as its dot).
  const obstacles=[];
  DATA.messages.forEach(mm=>{ if(inWin(execAt(mm))&&vidx[mm.to]!=null) obstacles.push({x:x(execAt(mm)),lane:vidx[mm.to]}); });
  vis.forEach((s,i)=> (DATA.turns[s.name]||[]).forEach(t=>{ if(inWin(startAt(t))) obstacles.push({x:x(startAt(t)),lane:i}); }));

  // ONE connector PER MESSAGE: sender lane (at send) → receiver lane (at PROCESS-START
  // = execAt). Each message draws its own line, so no message can appear to take longer
  // than its real send→processed latency (the old aggregate "flow band" spanned a whole
  // pair's first-send → last-delivery, making a day-long conversation look like one
  // multi-hour message). A pending message's head rides `now`, so it reads as genuinely
  // in-flight. Overlapping lines alpha-stack, so a busy pair still visibly thickens.
  // Hover brightens that single message's line and shows its sent→processed times.
  DATA.messages.forEach(mm=>{
    if(vidx[mm.from]==null||vidx[mm.to]==null) return;
    if(execAt(mm)<t0||mm.sent>t1) return;
    const sLane=vidx[mm.from], rLane=vidx[mm.to];
    const xs=x(Math.max(mm.sent,t0)), ys=laneY(sLane), xe=x(execAt(mm)), ye=laneY(rLane), col=colorOf(mm.from);
    const dir=(ys<ye)?1:-1, track=ye-dir*MSG_DROP;
    const xc=crossX(sLane,rLane,xs,xe,obstacles);
    const pts=(xc>xs+0.5)?[{x:xs,y:ys},{x:xc,y:ys},{x:xc,y:track},{x:xe,y:track},{x:xe,y:ye}]
                         :[{x:xs,y:ys},{x:xs,y:track},{x:xe,y:track},{x:xe,y:ye}];
    const d=roundedPath(pts,CORNER);
    svg.appendChild(el('path',{d,class:'msg-line',stroke:col,'stroke-width':MSG_W0,opacity:mm.pending?0.4:0.5,
      ...(mm.pending?{'stroke-dasharray':'1 4'}:{})}));   // pending = dotted, in-flight
    const hl=el('path',{d,class:'msg-line',stroke:col,'stroke-width':MSG_W0+3,opacity:0});
    svg.appendChild(hl);
    const hit=el('path',{d,class:'hit msg-line',stroke:'transparent','stroke-width':14});
    const html=()=>`<div class="row"><span class="chip" style="background:${col}"></span>`+
      `<span class="who" style="color:${col}">${mm.from}</span><span class="arrow">→</span>`+
      `<span class="who" style="color:${colorOf(mm.to)}">${mm.to}</span>${mm.pending?' <span class="kind">pending</span>':''}<span class="time">${clock(mm.sent)}${mm.pending?' → …':' → '+clock(mm.exec)}</span></div>`+
      bodyDiv(esc(mm.summary||mm.text||''));
    hit.addEventListener('mouseenter',e=>{hl.setAttribute('opacity','0.95');showTip(html(),e);});
    hit.addEventListener('mousemove',moveTip);
    hit.addEventListener('mouseleave',()=>{hl.setAttribute('opacity','0');hideTip();});
    svg.appendChild(hit);
  });

  function dot(cx,cy,color,html){
    const c=el('circle',{class:'dot',cx,cy,r:DOT_R,fill:color,stroke:'var(--dotBorder)','stroke-width':1.5});
    c.addEventListener('mouseenter',e=>{c.setAttribute('r',DOT_R+2);showTip(html(),e);});
    c.addEventListener('mousemove',moveTip);
    c.addEventListener('mouseleave',()=>{c.setAttribute('r',DOT_R);hideTip();});
    svg.appendChild(c);
  }

  // message process-start dots (sender colour) — at execAt: the real processed time,
  // or `now` while pending so an in-flight message sits at the live edge, never mid-bar.
  DATA.messages.forEach(mm=>{
    if(vidx[mm.to]==null||!inWin(execAt(mm))) return;
    const col=colorOf(mm.from), cy=laneY(vidx[mm.to]);
    dot(x(execAt(mm)),cy,col,()=>`<div class="row"><span class="chip" style="background:${col}"></span>`+
      `<span class="who" style="color:${col}">${mm.from}</span><span class="arrow">→</span>`+
      `<span class="who" style="color:${colorOf(mm.to)}">${mm.to}</span><span class="time">${clock(mm.sent)}${mm.pending?' → …':' → '+clock(mm.exec)}</span></div>`+
      bodyDiv(esc(mm.summary||mm.text||'')));
  });

  // turn-start (prompt) dots, session colour — skipped where a message exec coincides
  vis.forEach((s,i)=>{
    const y=laneY(i);
    (DATA.turns[s.name]||[]).forEach(t=>{
      if(!inWin(startAt(t))) return;
      if(DATA.messages.some(mm=>mm.to===s.name&&!mm.pending&&Math.abs(execAt(mm)-startAt(t))<=COINCIDE)) return;  // a PROCESSED msg dot stands in (a pending one at `now` must not suppress a real turn dot)
      const klabel = t.pending ? 'queued' : (t.src==='drain' ? 'message' : '');   // mode hint
      dot(x(startAt(t)),y,s.color,()=>`<div class="row"><span class="chip" style="background:${s.color}"></span>`+
        `<span class="who" style="color:${s.color}">${s.name}</span><span class="time">${clock(startAt(t))}</span>`+
        `${klabel?`<span class="kind">${klabel}</span>`:''}</div>`+
        bodyDiv(turnReq(t)));
    });
  });
}

// fit the window to the data span (1h … 12h) so activity shows immediately
function fitWindow(){
  let e = dataNow;
  DATA.messages.forEach(m=>{ if(m.sent) e=Math.min(e,m.sent); });
  Object.values(DATA.turns).forEach(ts=>ts.forEach(t=>{ if(t.start) e=Math.min(e,t.start); }));
  winEl.value = valueForWindow(Math.min(12*3600, Math.max(3600, Math.round((dataNow - e)*1.15))));
}

// Adopt a fresh payload. Re-syncs the clock only when `now` actually advanced
// (server mode); a static snapshot (file mode) is adopted once, then keeps
// scrolling client-side off loadedAt so the timeline still moves forward.
function adoptData(d, label){
  if(!d || !d.sessions || !d.sessions.length) return false;
  if(loaded && d.now <= dataNow) return false;
  DATA=d; dataNow=d.now; loadedAt=performance.now();
  document.getElementById('src').textContent=label;
  if(!fitted){
    let saved=null; try{ saved=localStorage.getItem('romp-tl-win'); }catch(e){}
    if(saved!=null && /^\d+$/.test(saved)) winEl.value=saved; else fitWindow();  // saved drag wins over auto-fit
    fitted=true;
  }
  loaded=true; return true;
}

async function loadData(){
  try{
    const r=await fetch('data',{cache:'no-store'});
    if(r.ok){ if(adoptData(await r.json(),'live')) render(); return; }
  }catch(e){ /* not served — fall back to the generated snapshot / mock */ }
  if(window.ROMP_DATA){ if(adoptData(window.ROMP_DATA,'live data (snapshot)')) render(); }
  else if(!loaded){ adoptData(MOCK,'mock data — run romp-timeline-data for live'); render(); }
}

winEl.addEventListener('input',()=>{ try{ localStorage.setItem('romp-tl-win',winEl.value); }catch(e){} render(); });
addEventListener('resize',render);
loadData();                    // initial load (server /data, else snapshot, else mock)
setInterval(loadData, 4000);   // refresh data — live when served, no-op from file://
setInterval(render, 1000);     // advance the "now" edge so the timeline scrolls
render();
</script>
</body>
</html>
